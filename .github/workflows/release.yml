name: Release

on:
  push:
    branches:
      - main

jobs:
  Lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  Release:
    needs: Lint
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release
        uses: agilecustoms/release@main
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLIC_RELEASES_TOKEN }}
