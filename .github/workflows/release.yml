name: Release

on:
  push:
    branches:
      - main

jobs:
  Lint:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # shellcheck is preinstalled in GH Ubuntu image
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  Release:
    needs: Lint
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release
        uses: agilecustoms/release@main
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLIC_RELEASES_TOKEN }}
