name: Lint

on:
  push:
    branches-ignore:
      - main
  workflow_call: # called from 'release' workflow

jobs:
  Lint:
    runs-on: ubuntu-slim
    permissions:
      contents: read # required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # shellcheck is preinstalled in GH Ubuntu image
      - name: Shellcheck
        run: shellcheck scripts/*.sh
