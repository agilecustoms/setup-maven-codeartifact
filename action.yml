name: 'Setup Maven with CodeArtifact'
author: 'Alexey Chekulaev'
description: 'Setup java + maven and login (generate token) to resolve maven dependencies from AWS CodeArtifact repository'
branding:
  icon: package
  color: green
inputs:
  aws-account:
    description: 'AWS account number where the CodeArtifact domain is located'
    required: true
  aws-login:
    description: 'Login to AWS. Could be false if you login in AWS outside of this action'
    required: false
    default: 'true'
  aws-codeartifact-domain:
    description: 'CodeArtifact domain name'
    required: true
  aws-codeartifact-repository:
    description: 'CodeArtifact repository name'
    default: 'maven' # default repository name
    required: true
  aws-region:
    description: 'AWS region where the CodeArtifact domain is located'
    required: true
  aws-role:
    description: 'IAM role to assume, good option is /ci/builder'
    default: 'ci/builder' # this role should have permissions to access CodeArtifact
    required: false
  java-cache:
    description: 'Enabled by default, specify empty string to disable caching'
    required: false
    default: 'maven'
  java-cache-dependency-path:
    description: 'see https://github.com/actions/setup-java "cache-dependency-path"'
    required: false
  java-distribution:
    description: 'Java distribution, use Temurin as it is pre-cached in ubuntu-latest'
    required: false
    default: 'temurin'
  java-setup:
    description: 'Setup Java using actions/setup-java. Set to false if Java is setup outside of this action'
    required: false
    default: 'true'
  java-version:
    description: 'Java version to use'
    required: false
    default: '21' # latest LTS as of June 2025
  settings-mirrors:
    description: 'settings.xml mirrors section (optional)'
    required: false
  settings-pluginGroups:
    description: 'settings.xml pluginGroups section (optional)'
    required: false
  settings-pluginRepositories:
    description: 'Additional plugin repositories (besides CodeArtifact one)'
    required: false
    default: |
      <pluginRepository>
        <id>central</id>
        <url>https://repo.maven.apache.org/maven2/</url>
      </pluginRepository>
      <pluginRepository>
        <id>repo1</id>
        <url>https://repo1.maven.org/maven2/</url>
      </pluginRepository>
  settings-profile-properties:
    description: 'settings.xml profile properties (optional)'
    required: false
  settings-proxies:
    description: 'settings.xml proxies section (optional)'
    required: false
  settings-repositories:
    description: 'Additional repositories (besides CodeArtifact one)'
    required: false
    default: |
      <repository>
        <id>central</id>
        <url>https://repo.maven.apache.org/maven2/</url>
      </repository>
      <repository>
        <id>repo1</id>
        <url>https://repo1.maven.org/maven2/</url>
      </repository>

runs:
  using: "composite"
  steps:
    - name: Validate
      shell: bash
      env:
        REPOSITORY: ${{ inputs.aws-codeartifact-repository }}
        JAVA_CACHE: ${{ inputs.java-cache }}
      run: bash "$GITHUB_ACTION_PATH/scripts/validate.sh"

    - name: Setup Java
      if: ${{ inputs.java-setup == 'true' }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
        cache: ${{ inputs.java-cache }}
        cache-dependency-path: ${{ inputs.java-cache-dependency-path }}

    # receives a JWT from the GitHub OIDC provider, and then requests an access token from AWS
    # as result we got env vars: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN
    - name: Login AWS
      if: ${{ inputs.aws-login == 'true' }}
      uses: aws-actions/configure-aws-credentials@v6.0.0 # floating tag v6 is available, but updates must be controlled
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: arn:aws:iam::${{ inputs.aws-account }}:role/${{ inputs.aws-role }}

    # REPO_ID, TOKEN and HOST are used in settings.xml file (which used both in build and release jobs, just different IAM roles)
    # HOST is also used in parent pom.xml 'distributionManagement', so it is additionally put in env variable 'ARTIFACT_STORE_HOST'.
    # Env variables are JOB-scoped, so it gets available in next step when you call 'mvn deploy'
    - name: Generate CodeArtifact token and url
      id: codeartifact
      shell: bash
      env:
        ACCOUNT: ${{ inputs.aws-account }}
        DOMAIN: ${{ inputs.aws-codeartifact-domain }}
        REGION: ${{ inputs.aws-region }}
        REPOSITORY: ${{ inputs.aws-codeartifact-repository }}
      run: bash "$GITHUB_ACTION_PATH/scripts/codeartifact.sh"

    # inputs are passed via env (not ${{ }} in script), so their content is not interpreted by shell
    - name: Generate Maven settings.xml
      shell: bash
      env:
        REPOSITORY: ${{ inputs.aws-codeartifact-repository }}
        REPO_ID: ${{ steps.codeartifact.outputs.REPO_ID }}
        HOST: ${{ steps.codeartifact.outputs.HOST }}
        TOKEN: ${{ steps.codeartifact.outputs.TOKEN }}
        SETTINGS_MIRRORS: ${{ inputs.settings-mirrors }}
        SETTINGS_PLUGIN_GROUPS: ${{ inputs.settings-pluginGroups }}
        SETTINGS_PLUGIN_REPOSITORIES: ${{ inputs.settings-pluginRepositories }}
        SETTINGS_PROFILE_PROPERTIES: ${{ inputs.settings-profile-properties }}
        SETTINGS_PROXIES: ${{ inputs.settings-proxies }}
        SETTINGS_REPOSITORIES: ${{ inputs.settings-repositories }}
      run: bash "$GITHUB_ACTION_PATH/scripts/settings-xml.sh"

#    - name: Debug
#      shell: bash
#      run: cat $HOME/.m2/settings.xml # see ci.settings.xml
